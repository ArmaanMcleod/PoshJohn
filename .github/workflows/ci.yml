name: Test PoshJohn Module

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  BUILD_CONFIGURATION: ${{ fromJSON('["Debug", "Release"]')[github.ref == 'refs/heads/main'] }}

jobs:

  build-native-assets:
    name: Build Native Assets (${{ matrix.info.name }})
    runs-on: ${{ matrix.info.os }}
    strategy:
      fail-fast: false
      matrix:
        info:
        - name: Windows
          os: windows-latest
        - name: Linux
          os: ubuntu-latest
        - name: MacOS
          os: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Build All Native Assets (Windows)
        if: ${{ matrix.info.name == 'Windows' }}
        shell: pwsh
        run: ./scripts/windows/build-all.ps1

      - name: Build All Native Assets (Unix)
        if: ${{ matrix.info.name != 'Windows' }}
        shell: bash
        run: |
          chmod +x ./scripts/shared/build-all.sh
          sudo ./scripts/shared/build-all.sh

      - name: Upload John Assets
        uses: actions/upload-artifact@v4
        with:
          name: john-${{ matrix.info.name }}
          path: ${{ github.workspace }}/john
          if-no-files-found: error

      - name: Upload pdf2john Assets
        uses: actions/upload-artifact@v4
        with:
          name: pdf2john-${{ matrix.info.name }}
          path: ${{ github.workspace }}/src/pdf2john/dist
          if-no-files-found: error

      - name: Upload 7z2john Assets
        uses: actions/upload-artifact@v4
        with:
          name: 7z2john-${{ matrix.info.name }}
          path: ${{ github.workspace }}/perl/7z2john
          if-no-files-found: error

      - name: Upload archive7z Assets
        uses: actions/upload-artifact@v4
        with:
          name: archive7z-${{ matrix.info.name }}
          path: ${{ github.workspace }}/src/archive7z/build/dist
          if-no-files-found: error

  build-module:
    name: Build PowerShell Module
    needs:
      - build-native-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Repo checkout
      pull-requests: write  # Comment on PRs

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Build module
        shell: pwsh
        env:
          SKIP_NATIVE_BUILD_ASSETS: true
          SKIP_NATIVE_COPY_ASSETS: true
        run: ./PowerShellBuildTools/build.ps1 -Configuration $env:BUILD_CONFIGURATION -Task Build

      - name: Capture PowerShell Module
        uses: actions/upload-artifact@v4
        with:
          name: PSModule
          path: out/*.nupkg
          if-no-files-found: error

  test-module:
    name: Test PowerShell Module (${{ matrix.info.name }})
    needs:
      - build-module
    runs-on: ${{ matrix.info.os }}
    permissions:
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        info:
        - name: Windows
          os: windows-latest
        - name: Linux
          os: ubuntu-latest
        - name: MacOS
          os: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Restore Built PowerShell Module
        uses: actions/download-artifact@v4
        with:
          name: PSModule
          path: out

      - name: Download John Assets
        uses: actions/download-artifact@v4
        with:
          name: john-${{ matrix.info.name }}
          path: john-artifacts/${{ matrix.info.name }}

      - name: Download pdf2john Assets
        uses: actions/download-artifact@v4
        with:
          name: pdf2john-${{ matrix.info.name }}
          path: pdf2john-artifacts/${{ matrix.info.name }}

      - name: Download 7z2john Assets
        uses: actions/download-artifact@v4
        with:
          name: 7z2john-${{ matrix.info.name }}
          path: 7z2john-artifacts/${{ matrix.info.name }}

      - name: Download archive7z Assets
        uses: actions/download-artifact@v4
        with:
          name: archive7z-${{ matrix.info.name }}
          path: archive7z-artifacts/${{ matrix.info.name }}

      - name: Install Built PowerShell Module
        shell: pwsh
        run: |
          ./scripts/shared/install-module-artifacts.ps1 `
            -Platform "${{ matrix.info.name }}" `
            -ModuleManifestPath "./src/PoshJohn.psd1" `
            -OutputPath "out"

      - name: Install valgrind
        if: ${{ matrix.info.name == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Run Tests - PowerShell
        shell: pwsh
        run: |
          ./PowerShellBuildTools/build.ps1 -Configuration $env:BUILD_CONFIGURATION -Task TestPackage

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit Test Results (${{ matrix.info.name }})
          path: ./out/TestResults/Pester.xml
          if-no-files-found: error

      - name: Publish Test Results (${{ matrix.info.name }})
        if: ${{ matrix.info.os == 'ubuntu-latest' && always() }}
        uses: EnricoMi/publish-unit-test-result-action/linux@v2
        with:
          check_name: Unit Test Results (${{ matrix.info.name }})
          files: |
            ./out/TestResults/Pester.xml

      - name: Publish Test Results (${{ matrix.info.name }})
        if: ${{ matrix.info.os == 'macos-latest' && always() }}
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        with:
          check_name: Unit Test Results (${{ matrix.info.name }})
          files: |
            ./out/TestResults/Pester.xml

      - name: Publish Test Results (${{ matrix.info.name }})
        if: ${{ matrix.info.os == 'windows-latest' && always() }}
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        with:
          check_name: Unit Test Results (${{ matrix.info.name }})
          files: |
            ./out/TestResults/Pester.xml
