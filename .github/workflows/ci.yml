name: Test PoshJohn Module

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  BUILD_CONFIGURATION: ${{ fromJSON('["Debug", "Release"]')[github.ref == 'refs/heads/main'] }}

jobs:

  build-john:
    name: Build John Binaries (${{ matrix.osname }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - osname: Windows
            os: windows-latest
            john_build_script: /scripts/build-john-windows.ps1
            john_build_out: /john/windows/run
            pdf2john_build_script: /scripts/build-pdf2john-windows.ps1
            pdf2john_build_out: /src/pdf2john/windows/run
          - osname: Linux
            os: ubuntu-latest
            john_build_script: /scripts/build-john-linux.sh
            john_build_out: /john/linux/run
            pdf2john_build_script: /scripts/build-pdf2john-linux.sh
            pdf2john_build_out: /src/pdf2john/linux/run
          - osname: MacOS
            os: macos-latest
            john_build_script: /scripts/build-john-macos.sh
            pdf2john_build_script: /scripts/build-pdf2john-macos.sh
            john_build_out: /john/macos/run
            pdf2john_build_out: /src/pdf2john/macos/run
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Build John the Ripper (Windows)
        if: matrix.osname == 'Windows'
        shell: pwsh
        run: ${{github.workspace}}${{ matrix.john_build_script }}

      - name: Build John the Ripper (Linux/MacOS)
        if: matrix.osname != 'Windows'
        shell: bash
        run: |
          scriptPath=${{github.workspace}}${{ matrix.john_build_script }}
          chmod +x $scriptPath
          if [ "${{ matrix.osname }}" = "Linux" ]; then
            sudo $scriptPath
          else
            $scriptPath
          fi

      - name: Setup MSYS2
        if: matrix.osname == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - name: Build pdf2john (Windows)
        if: matrix.osname == 'Windows'
        shell: pwsh
        run: |
          ${{github.workspace}}${{ matrix.pdf2john_build_script }}

      - name: Build pdf2john (Linux/MacOS)
        if: matrix.osname != 'Windows'
        shell: bash
        run: |
          scriptPath=${{github.workspace}}${{ matrix.pdf2john_build_script }}
          chmod +x $scriptPath
          if [ "${{ matrix.osname }}" = "Linux" ]; then
            sudo $scriptPath
          else
            $scriptPath
          fi

      - name: Calculate John Package Size
        shell: pwsh
        run: |
          $path = "${{github.workspace}}${{ matrix.john_build_out }}"
          $sizeMB = [math]::Round((Get-ChildItem $path -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB, 2)
          Write-Host "${{ matrix.osname }} size: $sizeMB MB"
          "$sizeMB" | Out-File -FilePath "john-size-${{ matrix.osname }}.txt" -NoNewline

      - name: Upload John Package Size
        uses: actions/upload-artifact@v4
        with:
          name: john-size-${{ matrix.osname }}
          path: john-size-${{ matrix.osname }}.txt

      - name: Upload John Binaries
        uses: actions/upload-artifact@v4
        with:
          name: john-${{ matrix.osname }}
          path: ${{ github.workspace }}${{ matrix.john_build_out }}
          if-no-files-found: error

      - name: Upload pdf2john Files
        uses: actions/upload-artifact@v4
        with:
          name: pdf2john-${{ matrix.osname }}
          path: ${{ github.workspace }}${{ matrix.pdf2john_build_out }}
          if-no-files-found: error

  build-module:
    name: Build PowerShell Module
    needs:
      - build-john
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Repo checkout
      pull-requests: write  # Comment on PRs

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Download John Binaries (Windows)
        uses: actions/download-artifact@v4
        with:
          name: john-Windows
          path: ${{ github.workspace }}/john/windows/run

      - name: Download John Binaries (Linux)
        uses: actions/download-artifact@v4
        with:
          name: john-Linux
          path: ${{ github.workspace }}/john/linux/run

      - name: Download John Binaries (MacOS)
        uses: actions/download-artifact@v4
        with:
          name: john-MacOS
          path: ${{ github.workspace }}/john/macos/run

      - name: Download pdf2john files (Windows)
        uses: actions/download-artifact@v4
        with:
          name: pdf2john-Windows
          path: ${{ github.workspace }}/src/pdf2john/windows/run

      - name: Download pdf2john files (Linux)
        uses: actions/download-artifact@v4
        with:
          name: pdf2john-Linux
          path: ${{ github.workspace }}/src/pdf2john/linux/run

      - name: Download pdf2john files (MacOS)
        uses: actions/download-artifact@v4
        with:
          name: pdf2john-MacOS
          path: ${{ github.workspace }}/src/pdf2john/macos/run

      - name: Download platform sizes
        uses: actions/download-artifact@v4
        with:
          pattern: john-size-*
          path: platform-sizes

      - name: Build and test module
        shell: pwsh
        run: ./PowerShellBuildTools/build.ps1 -Configuration $env:BUILD_CONFIGURATION -Task Build

      - name: Check package size
        shell: pwsh
        run: |
          $nupkg = Get-Item out/*.nupkg
          $sizeMB = [math]::Round($nupkg.Length / 1MB, 2)
          Write-Host "Package size: $sizeMB MB"
          if ($sizeMB -gt 250) {
            Write-Error "Package size ($sizeMB MB) exceeds PowerShell Gallery limit of 250 MB"
            exit 1
          }
          Write-Host "Package size is within limits" -ForegroundColor Green

          # Save size for PR comment
          "PACKAGE_SIZE_MB=$sizeMB" >> $env:GITHUB_ENV

      - name: Comment package size on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const sizeMB = process.env.PACKAGE_SIZE_MB;
            const limit = 250;
            const percentUsed = ((sizeMB / limit) * 100).toFixed(1);

            // Read platform sizes
            const fs = require('fs');
            const windowsSize = fs.readFileSync('platform-sizes/john-size-Windows/john-size-Windows.txt', 'utf8');
            const linuxSize = fs.readFileSync('platform-sizes/john-size-Linux/john-size-Linux.txt', 'utf8');
            const macosSize = fs.readFileSync('platform-sizes/john-size-MacOS/john-size-MacOS.txt', 'utf8');

            const body = `## 📦 Package Size Report

            **Size:** ${sizeMB} MB / ${limit} MB (${percentUsed}% of limit)

            ${sizeMB > 240 ? '⚠️ **Warning:** Approaching size limit!' : '✅ Package size is within limits'}

            <details>
            <summary>Size breakdown by platform</summary>

            | Platform | Size |
            |----------|------|
            | Windows  | ${windowsSize} MB |
            | Linux    | ${linuxSize} MB |
            | macOS    | ${macosSize} MB |

            </details>`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📦 Package Size Report')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Capture PowerShell Module
        uses: actions/upload-artifact@v4
        with:
          name: PSModule
          path: out/*.nupkg
          if-no-files-found: error

  test:
    name: Test PowerShell Module (${{ matrix.info.name }})
    needs:
      - build-module
    runs-on: ${{ matrix.info.os }}
    permissions:
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        info:
        - name: Windows
          os: windows-latest
        - name: Linux
          os: ubuntu-latest
        - name: MacOS
          os: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Restore Built PowerShell Module
        uses: actions/download-artifact@v4
        with:
          name: PSModule
          path: out

      - name: Install Built PowerShell Module
        shell: pwsh
        run: |
          Import-Module ./PowerShellBuildTools/tools/helper.psm1 -Force
          Expand-Nupkg -ModuleManfifestPath ./src/PoshJohn.psd1 -OutputPath out

      - name: Run Tests - PowerShell
        shell: pwsh
        run: |
          ./PowerShellBuildTools/build.ps1 -Configuration $env:BUILD_CONFIGURATION -Task Test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit Test Results (${{ matrix.info.name }})
          path: ./out/TestResults/Pester.xml
          if-no-files-found: error

      - name: Publish Test Results (${{ matrix.info.name }})
        if: ${{ matrix.info.os == 'ubuntu-latest' && always() }}
        uses: EnricoMi/publish-unit-test-result-action/linux@v2
        with:
          check_name: Unit Test Results (${{ matrix.info.name }})
          files: |
            ./out/TestResults/Pester.xml

      - name: Publish Test Results (${{ matrix.info.name }})
        if: ${{ matrix.info.os == 'macos-latest' && always() }}
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        with:
          check_name: Unit Test Results (${{ matrix.info.name }})
          files: |
            ./out/TestResults/Pester.xml

      - name: Publish Test Results (${{ matrix.info.name }})
        if: ${{ matrix.info.os == 'windows-latest' && always() }}
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        with:
          check_name: Unit Test Results (${{ matrix.info.name }})
          files: |
            ./out/TestResults/Pester.xml
