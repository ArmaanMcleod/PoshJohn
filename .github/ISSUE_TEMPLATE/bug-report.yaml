name: Bug report
description: Report errors or unexpected behavior
title: '[BUG] <title>'
type: Bug
labels: ['bug', 'Needs: Triage :mag:']
body:
  - type: textarea
    attributes:
      label: Description of the issue
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error messages
      description: If an error message is generated by the output please provide it here.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Reproduction
      description: |
        How can we reproduce the issue.
        Please provide examples of the input you are using that are failing.
        For example, if password cracking is failing, please provide a sample file which can be used to reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version of PoshJohn
      description: Please provide the module version of PoshJohn you are using.
      placeholder: '1.x.x'
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: |
        Any additional context relating to the issue.
    validations:
      required: false
