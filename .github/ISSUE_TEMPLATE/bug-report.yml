name: "🐞 Bug Report"
description: Report a reproducible bug or regression in the PoshJohn PowerShell module.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out the form below.
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: >
        List of steps, sample code, failing test or link to a project that reproduces the behavior.
        Make sure you place a stack trace inside a code (```) block to avoid linking unrelated issues.
      placeholder: >
        I am experiencing a problem with X.
        I think Y should be happening but Z is actually happening.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      render: console
      placeholder: |
        PS> 2 + 2
        4
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior
      render: console
      placeholder: |
        PS> 2 + 2
        5
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error details
      description: Paste verbatim output from `Get-Error` if PowerShell return an error.
      render: console
      placeholder: PS> Get-Error
  - type: textarea
    attributes:
      label: Environment data
      description: Paste verbatim output from `$PSVersionTable` below.
      render: powershell
      placeholder: PS> $PSVersionTable
    validations:
      required: true
  - type: textarea
    attributes:
      label: Visuals
      description: >
        Please upload images or animations that can be used to reproduce issues in the area below.
        Try the [Steps Recorder](https://support.microsoft.com/en-us/windows/record-steps-to-reproduce-a-problem-46582a9b-620f-2e36-00c9-04e25d784e47)
        on Windows or [Screenshot](https://support.apple.com/en-us/HT208721) on macOS.
